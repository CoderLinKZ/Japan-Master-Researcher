[project]
name = "japan-master-researcher"
version = "0.1.0"
description = "A LangGraph-based research assistant for Japanese master's applications."
readme = "Readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.2.0,<2.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "langgraph>=1.2.11,<1.3.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
    "psycopg[binary]>=3.3.5,<4.0.0",
    "pypdf>=6.0.0,<7.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "uvicorn[standard]>=0.53.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["RUF001"]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "ruff>=0.16.8",
]
